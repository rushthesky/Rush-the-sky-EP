<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rush The Sky — EP</title>
<meta name="description" content="Rush The Sky, the debut EP from Rush The Sky. Coming soon to Spotify, Apple Music and everywhere else.">
<meta property="og:title" content="Rush The Sky — EP">
<meta property="og:description" content="Three tracks. Coming soon.">
<meta property="og:type" content="music.album">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..700;1,62..125,400..600&display=swap" rel="stylesheet">

<style>
  :root{
    --asphalt-deep:#161A1E;
    --asphalt:#1E242A;
    --panel:#28313A;
    --panel-lift:#333E48;
    --line:rgba(237,234,228,0.13);
    --paint:#EDEAE4;
    --dim:#93A0AA;
    --accent:#E5C233;
    --pad:clamp(1.25rem,5vw,2rem);
    --radius:2px;
    --measure:34rem;
  }
  /* Fixed dark palette by design — the photo always sits on its own ground,
     whatever theme the viewer is using. */
  :root:not([data-theme="light"]), :root[data-theme="dark"]{ color-scheme:dark; }

  *,*::before,*::after{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }

  body{
    margin:0;
    background:var(--asphalt-deep);
    color:var(--paint);
    font-family:Archivo,"Helvetica Neue",Helvetica,Arial,sans-serif;
    font-variation-settings:"wdth" 100;
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";
    position:fixed; inset:0; z-index:-1;
    background:
      radial-gradient(75% 40% at 50% 0%, rgba(120,140,155,0.16), transparent 72%),
      var(--asphalt);
  }

  .page{
    width:100%;
    max-width:var(--measure);
    margin:0 auto;
    padding:0 var(--pad) 3rem;
  }

  a{ color:inherit; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:3px; border-radius:2px; }

  /* ---------- Hero photograph ---------- */

  .hero{
    position:relative;
    margin:0 calc(-1 * var(--pad));
  }
  .hero img{
    display:block;
    width:100%;
    height:auto;
    max-height:70vh;
    object-fit:cover;
    object-position:50% 46%;
  }
  /* the road fades into the page so the type below sits on the same asphalt */
  .hero::after{
    content:"";
    position:absolute; left:0; right:0; bottom:-1px;
    height:34%;
    background:linear-gradient(to bottom, rgba(30,36,42,0) 0%, rgba(30,36,42,0.72) 62%, var(--asphalt) 100%);
    pointer-events:none;
  }

  /* ---------- Masthead ---------- */

  .masthead{
    position:relative;
    margin-top:-2.25rem;
    padding-bottom:1.75rem;
  }

  .wordmark{
    margin:0;
    font-size:clamp(3rem,15.5vw,4.9rem);
    font-variation-settings:"wdth" 125,"wght" 700;
    line-height:0.84;
    letter-spacing:-0.02em;
    text-transform:uppercase;
  }
  .wordmark span{ display:block; }

  .release{
    margin:1rem 0 0;
    font-size:1.0625rem;
    font-style:italic;
    color:var(--paint);
  }
  .meta{ margin:.35rem 0 0; font-size:.875rem; color:var(--dim); }
  .meta .status{ color:var(--accent); }

  .notice{
    margin:1.25rem 0 0;
    padding:.85rem 1rem;
    border-left:2px solid var(--accent);
    background:rgba(229,194,51,0.07);
    font-size:.875rem;
    line-height:1.55;
    color:var(--paint);
  }

  /* ---------- Tracklist ---------- */

  .tracks{ list-style:none; margin:0; padding:0; border-top:1px solid var(--line); }
  .track{ position:relative; border-bottom:1px solid var(--line); }

  .track-btn{
    display:grid;
    grid-template-columns:1.5rem 2.5rem 1fr auto;
    align-items:center;
    gap:.75rem;
    width:100%;
    padding:.95rem .25rem;
    background:none; border:0; color:inherit; font:inherit;
    text-align:left; text-decoration:none; cursor:pointer;
  }
  .track-num{ font-size:.8rem; color:var(--dim); font-variant-numeric:tabular-nums; transition:color .18s ease; }
  .track-icon{
    width:2.5rem; height:2.5rem;
    display:grid; place-items:center;
    border:1px solid var(--line); border-radius:50%;
    transition:background-color .18s ease, border-color .18s ease;
  }
  .track-icon svg{ width:.9rem; height:.9rem; fill:var(--paint); transition:fill .18s ease; }
  .track-btn:hover .track-icon{ border-color:var(--accent); }
  .track-title{ font-size:1.0625rem; font-variation-settings:"wdth" 100,"wght" 500; }
  .track-time{ font-size:.8125rem; color:var(--dim); font-variant-numeric:tabular-nums; }

  /* ---------- Platforms ---------- */

  .archive{ padding-top:2rem; }
  .archive h2{
    margin:0 0 .9rem;
    font-size:.9375rem;
    font-variation-settings:"wdth" 100,"wght" 500;
    color:var(--dim);
  }
  .archive-track{
    display:flex; align-items:center; gap:.9rem;
    padding:.85rem 1rem; margin-bottom:.5rem;
    background:var(--panel);
    border:1px solid transparent; border-radius:var(--radius);
    text-decoration:none;
    transition:background-color .16s ease, border-color .16s ease;
  }
  .archive-track:hover{ background:var(--panel-lift); border-color:var(--line); }
  .archive-mark{ width:1.4rem; height:1.4rem; flex:none; }
  .archive-mark svg{ width:100%; height:100%; display:block; }
  .archive-name{ flex:1; font-size:1rem; font-variation-settings:"wdth" 100,"wght" 500; }
  .archive-go{ font-size:.8125rem; color:var(--dim); }
  .archive-track:hover .archive-go{ color:#FF5500; }

  .listen{ padding-top:2.25rem; }
  .listen h2{
    margin:0 0 .9rem;
    font-size:.9375rem;
    font-variation-settings:"wdth" 100,"wght" 500;
    color:var(--dim);
  }

  .platform{
    display:flex; align-items:center; gap:.9rem;
    padding:.85rem 1rem; margin-bottom:.5rem;
    background:var(--panel);
    border:1px solid transparent; border-radius:var(--radius);
    text-decoration:none;
    transition:background-color .16s ease, border-color .16s ease;
  }
  a.platform:hover{ background:var(--panel-lift); border-color:var(--line); }
  .platform-mark{ width:1.4rem; height:1.4rem; flex:none; }
  .platform-mark svg{ width:100%; height:100%; display:block; }
  .platform-name{ flex:1; font-size:1rem; font-variation-settings:"wdth" 100,"wght" 500; }
  .platform-go{ font-size:.8125rem; color:var(--dim); }
  a.platform:hover .platform-go{ color:var(--accent); }

  .platform.pending{ background:transparent; border-color:var(--line); }
  .platform.pending .platform-mark{ opacity:.45; }
  .platform.pending .platform-name{ color:var(--dim); font-variation-settings:"wdth" 100,"wght" 400; }
  .platform.pending .platform-go{ color:rgba(147,160,170,0.7); }

  /* ---------- Footer ---------- */

  .foot{ padding-top:2.25rem; display:flex; flex-wrap:wrap; align-items:center; gap:.75rem 1.25rem; }
  .socials{ display:flex; gap:.35rem; margin:0; padding:0; list-style:none; }
  .socials a{
    display:grid; place-items:center;
    width:2.35rem; height:2.35rem;
    border:1px solid var(--line); border-radius:50%;
    transition:border-color .16s ease;
  }
  .socials a:hover{ border-color:var(--accent); }
  .socials svg{ width:1rem; height:1rem; fill:var(--dim); transition:fill .16s ease; }
  .socials a:hover svg{ fill:var(--accent); }

  .share{
    margin-left:auto;
    padding:.6rem 1rem;
    background:none; border:1px solid var(--line); border-radius:var(--radius);
    color:var(--dim); font:inherit; font-size:.8125rem; cursor:pointer;
    transition:border-color .16s ease, color .16s ease;
  }
  .share:hover{ border-color:var(--accent); color:var(--accent); }

  .colophon{
    width:100%; margin:1.75rem 0 0; padding-top:1.25rem;
    border-top:1px solid var(--line);
    font-size:.75rem; line-height:1.7; color:var(--dim);
  }

  .visually-hidden{
    position:absolute; width:1px; height:1px;
    margin:-1px; padding:0; border:0;
    clip-path:inset(50%); overflow:hidden; white-space:nowrap;
  }

  @media (prefers-reduced-motion:reduce){
    *{ transition-duration:.001ms !important; animation-duration:.001ms !important; }
  }
</style>
</head>

/* ---- render ---- */
const wm = document.getElementById("wordmark");
RELEASE.wordmark.forEach(w => {
  const s = document.createElement("span");
  s.textContent = w;
  wm.appendChild(s);
});
document.getElementById("release").textContent = RELEASE.title;
document.getElementById("status").textContent  = RELEASE.status;
document.getElementById("format").textContent  = " " + RELEASE.format;
document.getElementById("listen-head").textContent = RELEASE.listenHeading;
document.getElementById("colophon").textContent = RELEASE.credits;
document.title = RELEASE.artist + " — " + RELEASE.title;

const archiveSection = document.querySelector(".archive");
if (RELEASE.archive && RELEASE.archive.length) {
  document.getElementById("archive-head").textContent = RELEASE.archiveHeading;
  const archiveBox = document.getElementById("archive-list");
  RELEASE.archive.forEach(t => {
    const a = document.createElement("a");
    a.className = "archive-track";
    a.href = t.url;
    a.target = "_blank";
    a.rel = "noopener";
    a.innerHTML =
      '<span class="archive-mark">' + (MARKS[t.mark] || "") + '</span>' +
      '<span class="archive-name"></span>' +
      '<span class="archive-go">Listen</span>';
    a.querySelector(".archive-name").textContent = t.name;
    archiveBox.appendChild(a);
  });
} else {
  archiveSection.remove();
}

const noticeEl = document.getElementById("notice");
if (noticeEl && RELEASE.notice) { noticeEl.textContent = RELEASE.notice; } else if (noticeEl) { noticeEl.remove(); }

const ICON_LINK = '<svg viewBox="0 0 12 12"><path d="M4.2 2h5.8v5.8h-1.5V4.5L2.9 10 2 9.1l5.5-5.6H4.2z" fill="currentColor"/></svg>';

const trackList = document.getElementById("tracks");
RELEASE.tracks.forEach((t, i) => {
  const li = document.createElement("li");
  li.className = "track";
  li.innerHTML =
    '<a class="track-btn" href="' + RELEASE.primaryListenUrl + '" target="_blank" rel="noopener">' +
      '<span class="track-num">' + (i + 1) + '</span>' +
      '<span class="track-icon">' + ICON_LINK + '</span>' +
      '<span class="track-title"></span>' +
      '<span class="track-time">' + t.duration + '</span>' +
    '</a>';
  li.querySelector(".track-title").textContent = t.title;
  li.querySelector(".track-btn").setAttribute("aria-label", "Listen to " + t.title);
  trackList.appendChild(li);
});

const platformBox = document.getElementById("platforms");
RELEASE.platforms.forEach(p => {
  const live = Boolean(p.url) && p.url !== "#";
  const el = document.createElement(live ? "a" : "div");
  el.className = "platform" + (live ? "" : " pending");
  if (live) { el.href = p.url; el.target = "_blank"; el.rel = "noopener"; }
  el.innerHTML =
    '<span class="platform-mark">' + (MARKS[p.mark] || "") + '</span>' +
    '<span class="platform-name"></span>' +
    '<span class="platform-go">' + (live ? "Play" : "Soon") + '</span>';
  el.querySelector(".platform-name").textContent = p.name;
  platformBox.appendChild(el);
});

const socialBox = document.getElementById("socials");
RELEASE.socials.forEach(s => {
  if (!s.url) return;
  const li = document.createElement("li");
  const a = document.createElement("a");
  a.href = s.url;
  a.setAttribute("aria-label", s.name);
  if (s.url.startsWith("http")) { a.target = "_blank"; a.rel = "noopener"; }
  a.innerHTML = MARKS[s.mark] || "";
  li.appendChild(a);
  socialBox.appendChild(li);
});

/* ---- share ---- */
const shareBtn = document.getElementById("share");
shareBtn.addEventListener("click", async () => {
  const url = location.href;
  try {
    if (navigator.share) { await navigator.share({ title: RELEASE.artist + " — " + RELEASE.title, url }); return; }
    await navigator.clipboard.writeText(url);
    shareBtn.textContent = "Link copied";
    setTimeout(() => { shareBtn.textContent = "Share"; }, 2000);
  } catch (err) {
    shareBtn.textContent = "Press ⌘C to copy";
    setTimeout(() => { shareBtn.textContent = "Share"; }, 2500);
  }
});
</script>
</body>
</html>
